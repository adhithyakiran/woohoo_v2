<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>what is in the room</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🛏️</text></svg>" />
    <script>
      try { document.documentElement.dataset.theme = localStorage.getItem('woohoo-console-theme') === 'dark' ? 'dark' : 'light'; } catch (e) {}
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"></span>
        <span class="brand-name">what is in the room</span>
      </div>
      <select id="property-select" class="select" aria-label="Property"></select>
      <nav class="topnav">
        <a href="/">Control</a>
        <a href="/devices" class="here">Rooms &amp; devices</a>
        <a href="/commands">API commands</a>
        <a href="/agent">Agent activity</a>
      </nav>
      <div class="topbar-right" id="topbar-right">
        <a class="btn" href="http://127.0.0.1:8443" target="_blank" rel="noopener">Test console</a>
      </div>
    </header>

    <main class="layout two">
      <aside class="sidebar">
        <div class="sidebar-head">
          <input id="room-filter" class="input" type="search" placeholder="Filter rooms…" />
          <label class="check"><input type="checkbox" id="only-controllable" checked /> only ones that can do something</label>
        </div>
        <div class="room-list" id="room-list"></div>
        <div class="sidebar-foot" id="sidebar-foot"></div>
      </aside>

      <section class="content">
        <div class="content-head">
          <div>
            <h1 id="room-title">Pick a room</h1>
            <p class="muted" id="room-meta"></p>
          </div>
        </div>
        <div class="panel">
          <div class="scroll" id="detail">
            <p class="empty">A room holds one voice hub and the devices it can drive. Pick one.</p>
          </div>
        </div>
      </section>
    </main>

    <div class="toasts" id="toasts"></div>
    <script type="module" src="/devices.js"></script>
  </body>
</html>
